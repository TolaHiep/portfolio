<html lang="vi">
<head>
<meta charset="utf-8">

<link rel="canonical" href="https://nguyenmanhhiep.info/">

<style>
/* ═══ Dark techy / interactive ════════════════════════════════
   ink-black · neon cyan/violet · Archivo + mono · heavy GSAP    */
:root{
  --bg:#0a0a0f;
  --panel:#101018;
  --ink:#f3f4f8;
  --muted:#a2a2b0;     /* AA on --bg */
  --faint:#5c5c6b;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.18);
  --accent:#22d3ee;    /* cyan */
  --accent2:#a78bfa;   /* violet */

  --sans:'Archivo',Helvetica,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --u:8px;
  --t-xs:12px; --t-sm:14px; --t-base:16px; --t-md:20px; --t-lg:26px;
  --cols:12; --gap:20px;
  --tap:44px;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:var(--t-base);line-height:1.6;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
::selection{background:var(--accent);color:#04121a}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
section{scroll-margin-top:72px}
#about{scroll-margin-top:72px}

/* animated background: drifting neon blobs + faded tech grid */
.bg,.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg{overflow:hidden}
.bg span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30}
.bg .b1{width:62vw;height:62vw;background:radial-gradient(circle,#155e75,transparent 62%);top:-14vw;left:-12vw;animation:drift1 20s ease-in-out infinite alternate}
.bg .b2{width:54vw;height:54vw;background:radial-gradient(circle,#5b21b6,transparent 62%);bottom:-16vw;right:-14vw;animation:drift2 26s ease-in-out infinite alternate}
.bg .b3{width:40vw;height:40vw;background:radial-gradient(circle,#0e7490,transparent 62%);top:40%;left:55%;opacity:.18;animation:drift1 30s ease-in-out infinite alternate}
.bg-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%);opacity:.5}
@keyframes drift1{to{transform:translate(8vw,6vw) scale(1.15)}}
@keyframes drift2{to{transform:translate(-8vw,-5vw) scale(1.1)}}

/* cursor glow (pointer:fine only, toggled by JS) */
#glow{position:fixed;top:0;left:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.16),rgba(167,139,250,.08) 40%,transparent 62%);
  pointer-events:none;z-index:2;mix-blend-mode:screen;will-change:transform;opacity:0;transition:opacity .4s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  #glow{display:none}
}

/* ─── grid ─────────────────────────────────────────────────── */
.wrap{max-width:1290px;margin:0 auto;padding:0 calc(var(--u)*3);position:relative;z-index:3}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
@media (max-width:900px){:root{--cols:6}}
@media (max-width:600px){:root{--cols:4;--gap:14px}}

/* ─── bar ──────────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar__in{max-width:1290px;margin:0 auto;padding:0 calc(var(--u)*3);
  display:flex;justify-content:space-between;align-items:center;gap:var(--gap);height:64px}
.bar__id{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.bar__id i{color:var(--accent);font-style:normal}
.bar__nav{display:flex;align-items:center;gap:calc(var(--u)*2);min-width:0;flex:1;justify-content:flex-end}
.bar__links{display:flex;align-items:center;gap:calc(var(--u)*2.5);min-width:0;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity}
.bar__links::-webkit-scrollbar{display:none}
.bar__nav .lang{flex:0 0 auto}
.bar__link{display:inline-flex;align-items:center;min-height:var(--tap);
  font-family:var(--mono);font-size:var(--t-sm);color:var(--muted);
  border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.bar__link{white-space:nowrap;scroll-snap-align:start}
.bar__link[aria-current="true"]{color:var(--accent);border-color:var(--accent)}
.bar__link:hover{color:var(--accent);border-color:var(--accent)}
.lang{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.lang button{min-height:36px;min-width:40px;padding:0 12px;border:0;cursor:pointer;
  background:transparent;color:var(--muted);
  font-family:var(--mono);font-size:var(--t-xs);font-weight:600;transition:background .2s,color .2s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--accent);color:#04121a}
@media (max-width:900px){.bar__role{display:none}}
@media (max-width:600px){.bar__nav{gap:var(--u)}.bar__links{gap:calc(var(--u)*2)}.bar__link{font-size:var(--t-xs)}
  /* mép phải mờ dần để thấy là menu còn vuốt được */
  .bar__links{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}}

/* ─── hero ─────────────────────────────────────────────────── */
.hero{padding:calc(var(--u)*8) 0 calc(var(--u)*7);align-items:start}
.hero__lead{grid-column:span 8}
.hero__aside{grid-column:9 / span 4;display:flex;flex-direction:column;gap:calc(var(--u)*2);padding-top:calc(var(--u)*2);position:sticky;top:80px}
@media (max-width:900px){.hero__lead{grid-column:1/-1}.hero__aside{position:static;grid-column:1/-1;margin-top:calc(var(--u)*4);flex-direction:row;align-items:flex-start;gap:calc(var(--u)*4)}.hero__aside .hero__contact{flex:1}}
@media (max-width:600px){.hero__aside{flex-direction:column;align-items:stretch;margin-top:calc(var(--u)*3)}}
.hero__eyebrow{font-family:var(--mono);font-size:var(--t-sm);font-weight:500;letter-spacing:.08em;
  color:var(--accent);margin-bottom:calc(var(--u)*2);min-height:1.4em}
.caret{color:var(--accent)}
.hero__name{font-size:clamp(28px,4.6vw,68px);white-space:nowrap;font-weight:900;line-height:1.04;letter-spacing:-.03em;
  text-transform:uppercase;margin:0;perspective:600px}
.hero__name .wd{display:inline-block}
.hero__name .ch{display:inline-block;will-change:transform}
.hero__tagline{font-size:clamp(20px,2.8vw,32px);font-weight:600;line-height:1.2;letter-spacing:-.02em;
  color:var(--ink);margin:calc(var(--u)*3) 0 0;max-width:30ch}
.hero__about{margin-top:calc(var(--u)*3);padding-top:calc(var(--u)*2);border-top:1px solid var(--line);max-width:68ch}
.hero__about .about p{font-size:var(--t-base);line-height:1.6;margin:0 0 var(--u)}
.hero__about .about p:last-child{margin-bottom:0}
.hero__edu{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);margin-top:calc(var(--u)*2);
  padding-top:calc(var(--u)*1.5);border-top:1px solid var(--line)}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--u);margin-top:calc(var(--u)*3)}
.portrait-box{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-strong);box-shadow:0 0 0 1px rgba(34,211,238,.05),0 24px 60px -24px rgba(34,211,238,.25)}
.portrait-box img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .6s ease}
.portrait-box:hover img{transform:none}
.hero__contact{display:flex;flex-direction:column;font-family:var(--mono);font-size:var(--t-sm)}
.hero__contact a,.hero__contact span{display:flex;align-items:center;min-height:var(--tap);
  border-bottom:1px solid var(--line);color:var(--muted);transition:color .2s,padding-left .2s}
.hero__contact a:hover{color:var(--accent);padding-left:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 calc(var(--u)*3);cursor:pointer;border-radius:999px;
  font-family:var(--mono);font-size:var(--t-sm);font-weight:600;will-change:transform;
  border:1px solid var(--line-strong);transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
.btn--solid{background:var(--accent);color:#04121a;border-color:var(--accent)}
.btn--solid:hover{box-shadow:0 0 24px -2px rgba(34,211,238,.6)}
.btn--line{background:transparent;color:var(--ink)}
.btn--line:hover{border-color:var(--accent);color:var(--accent)}

/* ─── section heads ────────────────────────────────────────── */
.section{padding:calc(var(--u)*5) 0 calc(var(--u)*6)}
.head{display:flex;align-items:baseline;gap:calc(var(--u)*2);
  padding-bottom:calc(var(--u)*1.5);border-bottom:1px solid var(--line-strong);margin-bottom:calc(var(--u)*3)}
.head__num{font-family:var(--mono);font-size:var(--t-sm);font-weight:600;
  background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.head h2{font-size:clamp(30px,5vw,56px);font-weight:800;letter-spacing:-.03em;margin:0;flex:1;line-height:.95}
.head__count{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted)}

/* ─── projects ─────────────────────────────────────────────── */
.proj{padding:calc(var(--u)*3) 0;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.proj__meta{grid-column:span 3;display:flex;flex-direction:column;gap:var(--u);align-self:start;position:sticky;top:80px}
.proj__no{font-family:var(--mono);font-size:var(--t-sm);font-weight:700;color:var(--accent)}
.proj__meta .proj__links{flex-direction:column;gap:0}
.proj__body{grid-column:4 / -1}
@media (max-width:900px){.proj__meta{grid-column:1/-1;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--u) calc(var(--u)*2)}
  .proj__meta .proj__links{flex-direction:row;gap:calc(var(--u)*2)}.proj__body{grid-column:1/-1}}
.proj__top{margin-bottom:calc(var(--u)*.5)}
.proj__name{font-size:clamp(24px,2.6vw,30px);font-weight:700;letter-spacing:-.02em;margin:0}
.proj__year{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted)}
.proj__tagline{font-size:var(--t-base);line-height:1.5;color:var(--muted);margin:0 0 var(--u)}
.psr__row{padding:var(--u) 0;border-top:1px solid var(--line)}
.psr__lbl{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.psr__txt{font-size:15px;line-height:1.5;margin:0;color:#d7d8e0}
.stack{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);margin-top:var(--u)}
.chip{font-family:var(--mono);font-size:var(--t-xs);padding:5px 10px;border-radius:999px;
  background:var(--panel);color:var(--muted);border:1px solid var(--line);transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.proj__src{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);
  font-family:var(--mono);font-size:var(--t-sm);font-weight:600;color:var(--accent);
  border-bottom:1px solid transparent;transition:border-color .2s}
.proj__src:hover{border-color:var(--accent)}
.proj__private{display:inline-flex;align-items:center;min-height:var(--tap);
  font-family:var(--mono);font-size:var(--t-sm);color:var(--muted)}
.proj__links{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3)}

/* ─── skills ───────────────────────────────────────────────── */
.key{grid-column:span 4}
@media (max-width:900px){.key{grid-column:span 3}}
@media (max-width:600px){.key{grid-column:1/-1}}
.key__lbl{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding-bottom:calc(var(--u)*1);margin-bottom:calc(var(--u)*2);
  border-bottom:1px solid var(--line-strong)}
.key__set{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.75)}
.key__set .chip{font-family:var(--sans);font-size:var(--t-sm);padding:6px 12px}

/* ─── education ────────────────────────────────────────────── */
.edu__row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:var(--u);flex-wrap:wrap}
.edu__school{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.02em}
.edu__degree{font-size:var(--t-sm);color:var(--muted);margin-top:6px}
.edu__years{font-family:var(--mono);font-size:var(--t-sm);color:var(--muted)}

/* ─── contact ──────────────────────────────────────────────── */
.contact{margin-top:calc(var(--u)*5);padding:calc(var(--u)*8) 0 calc(var(--u)*8);border-top:1px solid var(--line-strong)}
.contact__body{grid-column:span 7}
.contact__side{grid-column:9 / span 4}
@media (max-width:900px){.contact__body,.contact__side{grid-column:1 / -1}}
.contact__title{font-size:clamp(34px,6vw,72px);font-weight:900;line-height:1.12;letter-spacing:-.01em;word-spacing:.08em;margin:0 0 calc(var(--u)*3);max-width:14ch}
.contact__sub{font-size:var(--t-base);line-height:1.7;color:var(--muted);margin:0 0 calc(var(--u)*4);max-width:52ch}
.contact__cta{display:flex;flex-wrap:wrap;gap:var(--u)}
.contact__list{display:flex;flex-direction:column;font-family:var(--mono);font-size:var(--t-sm)}
.contact__list a,.contact__list span{display:flex;align-items:center;min-height:var(--tap);
  border-bottom:1px solid var(--line);color:var(--muted);transition:color .2s,padding-left .2s}
.contact__list a:hover{color:var(--accent);padding-left:6px}
.foot{padding:calc(var(--u)*4) 0;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--u)}
.foot a:hover{color:var(--accent)}

/* ─── hero lead paragraph ──────────────────────────────────── */
.hero__sub{font-size:var(--t-base);line-height:1.7;color:var(--muted);margin:calc(var(--u)*2) 0 0;max-width:56ch}
.hero__keys{font-family:var(--mono);font-size:var(--t-sm);color:var(--accent2);margin-top:calc(var(--u)*2);letter-spacing:.02em}

/* ─── flow line (pipeline steps) ───────────────────────────── */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*1.25);margin:calc(var(--u)*1.5) 0 0}
.flow span{font-family:var(--mono);font-size:var(--t-xs);padding:5px 10px;border-radius:6px;
  background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.25);color:#bdf3fb}
.flow i{font-style:normal;color:var(--faint);font-size:var(--t-xs)}

/* ─── role chips ───────────────────────────────────────────── */
.roles{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);margin-top:2px}
.roles span{font-family:var(--mono);font-size:var(--t-xs);padding:4px 9px;border-radius:999px;
  border:1px solid var(--line-strong);color:var(--muted)}

/* ─── about ────────────────────────────────────────────────── */
.about{grid-column:span 7}
.about p{font-size:var(--t-base);line-height:1.6;color:#d7d8e0;margin:0 0 var(--u);max-width:62ch}
.about p:last-child{margin-bottom:0}
.psr__txt,.about p,.more__body,.proj__tagline,.contact__sub{text-align:justify;hyphens:auto}

/* ─── mục Thành tích ───────────────────────────────────────── */
.awards__txt{grid-column:span 5}
.awards__carousel{grid-column:7 / span 6;align-self:start}
.awards__viewport{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--panel);aspect-ratio:16/10}
.awards__track{height:100%;display:flex;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.awards__track img{width:100%;height:100%;flex:0 0 100%;object-fit:contain;padding:8px}
.awards__nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;
  border:1px solid var(--line-strong);background:rgba(5,8,17,.72);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;font-size:24px;line-height:1;backdrop-filter:blur(10px);transition:border-color .2s,color .2s,background .2s}
.awards__nav:hover{border-color:var(--accent);color:var(--accent);background:rgba(5,8,17,.9)}
.awards__nav--prev{left:10px}
.awards__nav--next{right:10px}
.awards__dots{display:flex;justify-content:center;gap:8px;margin-top:calc(var(--u)*1.25)}
.awards__dot{width:9px;height:9px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;padding:0}
.awards__dot[aria-current=true]{background:var(--accent);border-color:var(--accent)}
@media (max-width:900px){.awards__txt,.awards__carousel{grid-column:1/-1}.awards__carousel{margin-top:calc(var(--u)*2)}}
.awards__year{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);letter-spacing:.1em}
.awards__title{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.02em;margin:calc(var(--u)*1) 0 calc(var(--u)*2)}
.awards__list{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.75)}
.awards__list span{font-family:var(--mono);font-size:var(--t-xs);padding:6px 12px;border-radius:999px;
  background:linear-gradient(120deg,rgba(34,211,238,.12),rgba(167,139,250,.12));
  border:1px solid rgba(34,211,238,.3);color:#bdf3fb}

/* ─── collapsible technical detail ─────────────────────────── */
.more{margin-top:0}
.more>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;
  min-height:var(--tap);font-family:var(--mono);font-size:var(--t-xs);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"+";font-size:var(--t-sm)}
.more[open]>summary::after{content:"−"}
.more__body{font-size:15px;line-height:1.5;color:var(--muted);margin:var(--u) 0 0;
  padding-left:calc(var(--u)*2);border-left:1px solid var(--line-strong)}

@media (max-width:900px){
  .section{padding:calc(var(--u)*5) 0 calc(var(--u)*7)}
  .head{margin-bottom:calc(var(--u)*3)}
  .proj{padding:calc(var(--u)*4) 0}
  .portrait-box{max-width:380px}
  .hero__name{font-size:7vw}
}
@media (max-width:600px){
  section,#about{scroll-margin-top:68px}
  .hero{padding:calc(var(--u)*6) 0 calc(var(--u)*5)}
  .hero__name{font-size:clamp(24px,7.6vw,40px)}
  .hero__tagline{font-size:clamp(18px,6vw,24px)}
  .hero__about .about p,.psr__txt,.about p{line-height:1.55}
  .section{padding:calc(var(--u)*4) 0 calc(var(--u)*6)}
  .head{align-items:flex-start;gap:var(--u);margin-bottom:calc(var(--u)*2.5)}
  .head h2{font-size:clamp(28px,10vw,42px);line-height:1}
  .proj{padding:calc(var(--u)*3.5) 0}
  .awards__viewport{border-radius:8px;aspect-ratio:4/3}
  .awards__track img{padding:4px}
  .awards__nav{width:36px;height:36px}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

      {id:'senai', name:'SenAI', year:'2026',
       tagline:'Real-time multilingual meeting interpreter (Vietnamese–English by default), deployable on-premise for organisations that must keep their data in-house, or run on commercial APIs.',
       problem:'Bilingual meetings have built-in latency while everyone waits for a human interpreter, and the minutes are compiled by hand afterwards. Many organisations also have security rules that forbid sending meeting content to a cloud service, so the system has to run on infrastructure they control.',
       built:'I built a LiveKit-based meeting room that runs on-premise or on commercial APIs. The main architectural decision is a separate recognition and translation pipeline for each microphone, so one speaker\'s voice never bleeds into another\'s. Bilingual subtitles appear while people are still talking, and when the meeting ends a bilingual transcript, a summary and Word/PDF minutes go out by email. Around that core I built the whole Next.js 16 app: seven feature screens, its own design system, VI/EN localisation, light/dark themes and PWA support.',
       more:'The room has camera, screen share, two-way translated chat, a waiting room with a host-controlled approval gate, mute/kick, a speaker mode that grants and revokes the right to talk, and QR invites. The settings panel can be edited mid-meeting: the bot reloads its config and restarts the per-mic handlers, so a change applies in about a second without anyone leaving the room. On the data side I migrated the store from SQLite to PostgreSQL + pgvector while keeping the public function signatures intact, so none of the calling code had to change. After the competition I added Sen Live (a large multilingual subtitle screen), Sen Notes (recording transcription with Soniox that separates three or more speakers), detailed minutes with an assistant that answers questions about them, per-speaker voiced translation with ElevenLabs, and the production UI: a Google Meet-style room, a device-check lobby, an admin dashboard and support tickets.',
       flow:['speech','ASR','fast translation','LLM refine with glossary','subtitles + spoken output','summary minutes'],
       aiNote:'Translation runs in two lanes: a fast draft goes out while the person is still talking, then an LLM edits it asynchronously and replaces that exact line in place. A model router splits the system by capability, so providers can be swapped at runtime without code changes, and a missing key or a provider failure falls back to the self-hosted model. The same split is how one product runs both on-premise and on commercial APIs. Domain terms and uploaded documents are embedded into pgvector and used as the translation glossary and for correcting ASR errors phonetically.',
       role:['Entire frontend','Backend & data','Real-time meeting room','Translation pipeline & LLM integration','Specs & technical docs','CI/CD & VPS deployment'],
       result:'With the project team, we went from an empty repo to a public deployment at app.senai.online in three weeks. Measured on the pipeline, it takes about 220 ms from the end of a sentence to a translation on screen. There are 37 UAT suites with 147 real, non-mocked tests. CI runs on every push. I later moved deploys to GitHub Actions over SSH with a forced command, and made the pipeline skip the API restart when a commit only touches docs, so a meeting in progress doesn\'t get cut off.',

       tagline:'Sales automation CRM: from a customer list in Excel to Zalo OA messages and emails sent on schedule, with three React dashboards and the infrastructure under them.',
       problem:'Sales staff found prospects on Google Maps, copied each phone number into a spreadsheet by hand, then messaged and emailed them one at a time. Lists filled up with duplicates, follow-ups were forgotten, and nobody could tell whether a message had actually reached the customer.',
       built:'I designed the architecture and built the FastAPI backend, three React apps behind a single domain (a shared login portal, an admin dashboard and a customer dashboard), and the infrastructure under them. The main flow: users upload a customer list as Excel, the system validates it and flags duplicates before anything is sent, personalises each message, and schedules the Zalo OA and email sends for the exact time requested.',
       more:'The hardest requirement was sending on time without ever sending twice, so the scheduler runs in two layers: in-memory date-triggered jobs for minute-accurate sending, plus a 60-second DB sweep as a safety net for jobs lost to a backend restart. When both layers reach the same message, SELECT FOR UPDATE NOWAIT decides which one sends it. Email status comes from the SendGrid event webhook; the endpoint has no auth by design, so it verifies the ECDSA signature, and because SendGrid replays events out of order, a status only moves forward when the incoming one outranks the stored one (delivered - opened - clicked - bounced). Zalo OA sits behind one provider interface with mock and real implementations, switched by environment variable and falling back to mock when credentials are missing, so development never depends on a live OA account; OA tokens refresh in the background. On the infrastructure side, Nginx does path-based routing on one domain with auto-renewing Let\'s Encrypt SSL, everything runs on Docker Compose, and deploys go out through GitHub Actions.',

/* The prompt rules below are quoted (condensed) from the real source in
   E25_OCR/frontend/lib/templatePrompt.ts - do not embellish them. */
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let lang = localStorage.getItem('lang') === 'en' ? 'en' : 'vi';
let awardIndex = 0;
let awardTimer = null;

function updateAwardsCarousel(nextIndex = awardIndex) {
  const track = document.getElementById('awards-track');
  if (!track) return;
  awardIndex = (nextIndex + AWARD.pics.length) % AWARD.pics.length;
  track.style.transform = `translateX(${-awardIndex * 100}%)`;
  document.querySelectorAll('.awards__dot').forEach((dot, i) => {
    dot.setAttribute('aria-current', i === awardIndex);
  });
}

function startAwardCarousel() {
  window.clearInterval(awardTimer);
  if (REDUCE) return;
  awardTimer = window.setInterval(() => updateAwardsCarousel(awardIndex + 1), 4500);
}

// split into words (wrap, inline-block) then per-char spans for stagger animation
const splitChars = text => text.split(' ')
  .map(w => `<span class="wd">${w.split('').map(c => `<span class="ch">${esc(c)}</span>`).join('')}</span>`)
  .join(' ');

const row = (lbl, body) => `
  <div class="psr__row">
    <div class="psr__lbl">${esc(lbl)}</div>
    ${body}
  </div>`;

const txt = t => `<p class="psr__txt">${esc(t)}</p>`;
const flowLine = steps => `<div class="flow">${steps.map(s => `<span>${esc(s)}</span>`).join('<i>→</i>')}</div>`;

function projectCard(p, c, i) {
  const aiBlock = p.flow
    ? row(c.lblAi, `${flowLine(p.flow)}${p.aiNote ? `<p class="psr__txt" style="margin-top:12px">${esc(p.aiNote)}</p>` : ''}`)
    : '';
  const more = `
    <details class="more">
      <summary>${esc(c.lblMore)}</summary>
      ${row(c.lblBuilt, `${txt(p.built)}${p.more ? `<p class="more__body">${esc(p.more)}</p>` : ''}`)}
      ${aiBlock}
    </details>`;
  return `
    <article class="proj grid" data-reveal>
      <aside class="proj__meta">
        <div class="proj__no">/${String(i + 1).padStart(2, '0')}</div>
        <span class="proj__year">${esc(p.year)}</span>
        <div><div class="psr__lbl">${esc(c.lblRole)}</div>
        <div class="roles">${p.role.map(r => `<span>${esc(r)}</span>`).join('')}</div></div>
        <div class="proj__links">
          ${p.demo ? `<a class="proj__src" href="${esc(p.demo)}" target="_blank" rel="noopener">${esc(c.liveDemo)} →</a>` : ''}
          ${p.github
            ? `<a class="proj__src" href="${esc(p.github)}" target="_blank" rel="noopener">${esc(c.viewCode)} →</a>`
            : `<span class="proj__private">${esc(c.privateRepo)}</span>`}
        </div>
      </aside>
      <div class="proj__body">
        <div class="proj__top">
          <h3 class="proj__name">${esc(p.name)}</h3>
        </div>
        <p class="proj__tagline">${esc(p.tagline)}</p>
        ${row(c.lblProblem, txt(p.problem))}
        ${row(c.lblResult, txt(p.result))}
        ${more}
        <div class="stack">${p.stack.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
      </div>
    </article>`;
}

function render() {
  const c = CONTENT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = c[el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('work-count').textContent = c.countFmt(c.projects.length);

  document.getElementById('hero-name').innerHTML = splitChars(c.name);

  const aw = AWARD[lang];
  document.getElementById('awards-body').innerHTML = `
    <div class="awards__txt" data-reveal>
      <div class="awards__year">2026</div>
      <h3 class="awards__title">${esc(aw.t)}</h3>
      <div class="awards__list">${aw.items.map(i => `<span>${esc(i)}</span>`).join('')}</div>
      <p class="psr__txt" style="margin-top:16px">${esc(c.awardsLead)}</p>
      <p class="psr__txt" style="margin-top:12px;color:var(--muted)">${esc(c.awardsWhat)}</p>
      <a class="proj__src" href="https://app.senai.online" target="_blank" rel="noopener">SenAI - ${esc(c.liveDemo)} →</a>
    </div>
    <div class="awards__carousel" data-awards-carousel data-reveal>
      <div class="awards__viewport">
        <div class="awards__track" id="awards-track">
          ${AWARD.pics.map((src, i) => `<img src="${esc(src)}" alt="${esc(aw.items[i] || aw.t)}" loading="${i ? 'lazy' : 'eager'}">`).join('')}
        </div>
        <button class="awards__nav awards__nav--prev" type="button" data-award-dir="-1" aria-label="Previous award">&lsaquo;</button>
        <button class="awards__nav awards__nav--next" type="button" data-award-dir="1" aria-label="Next award">&rsaquo;</button>
      </div>
      <div class="awards__dots">
        ${AWARD.pics.map((_, i) => `<button class="awards__dot" type="button" data-award-index="${i}" aria-label="Show award ${i + 1}"></button>`).join('')}
      </div>
    </div>`;
  updateAwardsCarousel(awardIndex);
  startAwardCarousel();

  document.getElementById('projects').innerHTML = c.projects.map((p, i) => projectCard(p, c, i)).join('');

  document.getElementById('keys').innerHTML = c.stack.map(g => `
    <div class="key" data-reveal>
      <div class="key__lbl">${esc(g.label)}</div>
      <div class="key__set">${g.items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>
    </div>`).join('');

  document.getElementById('hero-about').innerHTML =
    c.about.map(p => `<p>${esc(p)}</p>`).join('');

  animateName();
  typeEyebrow(c.heroKicker);
  initMotion();
}

/* ─── scrollspy: đánh dấu mục đang xem trên menu ───────────── */
(function () {
  const links = Array.from(document.querySelectorAll('.bar__link'));
  const map = new Map();
  links.forEach(a => {
    const el = document.querySelector(a.getAttribute('href'));
    if (el) map.set(el, a);
  });
  if (!map.size) return;
  const mark = el => links.forEach(a => a.setAttribute('aria-current', map.get(el) === a));
  const io = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (visible) mark(visible.target);
  }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, .25, .5, 1] });
  map.forEach((_, el) => io.observe(el));
})();

// one delegated listener survives every re-render
document.addEventListener('click', e => {
  const langBtn = e.target.closest('.lang button');
  if (langBtn) { lang = langBtn.dataset.lang; localStorage.setItem('lang', lang); render(); return; }

  const awardDir = e.target.closest('[data-award-dir]');
  if (awardDir) {
    updateAwardsCarousel(awardIndex + Number(awardDir.dataset.awardDir));
    startAwardCarousel();
    return;
  }

  const awardDot = e.target.closest('[data-award-index]');
  if (awardDot) {
    updateAwardsCarousel(Number(awardDot.dataset.awardIndex));
    startAwardCarousel();
    return;
  }
});

/* ─── GSAP motion ──────────────────────────────────────────── */
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = window.matchMedia('(pointer: fine)').matches;
const hasGSAP = typeof gsap !== 'undefined';
let heroPlayed = false, typeGen = 0, motionTriggers = [];

if (hasGSAP && !REDUCE) gsap.registerPlugin(ScrollTrigger);

// terminal-style typing for the eyebrow; cancels itself on re-render via generation token
function typeEyebrow(text) {
  const el = document.getElementById('typed');
  typeGen++; const g = typeGen;
  if (!hasGSAP || REDUCE) { el.textContent = text; return; }
  el.textContent = ''; let i = 0;
  (function step() {
    if (g !== typeGen) return;
    el.textContent = text.slice(0, i);
    if (i++ <= text.length) setTimeout(step, 42);
  })();
}

// name chars fly in - re-runs each render (nice on language toggle)
function animateName() {
  if (!hasGSAP || REDUCE) return;
  gsap.from('#hero-name .ch', {
    autoAlpha: 0, y: 36, rotateX: -55, transformOrigin: '50% 100%',
    stagger: { each: 0.018, from: 'start' }, duration: 0.6, ease: 'back.out(1.4)'
  });
}

function heroIntro() {
  if (heroPlayed || !hasGSAP || REDUCE) return;
  heroPlayed = true;
  gsap.timeline({ defaults: { ease: 'power3.out' } })
    .from('.hero__eyebrow', { autoAlpha: 0, y: 12, duration: 0.6 }, 0.2)
    .from('.hero__about', { autoAlpha: 0, y: 16, duration: 0.7 }, 0.45)
    .from('.hero__cta > *', { autoAlpha: 0, y: 16, duration: 0.6, stagger: 0.1 }, 0.55)
    .from('.hero__aside', { autoAlpha: 0, y: 24, duration: 0.8 }, 0.6);
}

// interactions bound once (glow + magnetic buttons are on static markup)
function initInteractions() {
  if (!hasGSAP || REDUCE) return;
  if (FINE) {
    const glow = document.getElementById('glow');
    glow.style.opacity = 1;
    const xTo = gsap.quickTo(glow, 'x', { duration: 0.5, ease: 'power3' });
    const yTo = gsap.quickTo(glow, 'y', { duration: 0.5, ease: 'power3' });
    window.addEventListener('pointermove', e => { xTo(e.clientX); yTo(e.clientY); });

    document.querySelectorAll('[data-magnet]').forEach(el => {
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        gsap.to(el, { x: (e.clientX - r.left - r.width / 2) * 0.4, y: (e.clientY - r.top - r.height / 2) * 0.5, duration: 0.4, ease: 'power2.out' });
      });
      el.addEventListener('pointerleave', () => gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)' }));
    });
  }
}

function initMotion() {
  if (!hasGSAP || REDUCE) return;
  motionTriggers.forEach(t => t.kill());
  motionTriggers = [];

  // scroll reveal - replays each time an element enters (onLeaveBack re-hides)
  gsap.set('[data-reveal]', { autoAlpha: 0, y: 60 });
  motionTriggers.push(...ScrollTrigger.batch('[data-reveal]', {
    start: 'top 90%',
    onEnter: b => gsap.to(b, { autoAlpha: 1, y: 0, duration: 0.9, stagger: 0.12, ease: 'power3.out', overwrite: true }),
    onLeaveBack: b => gsap.set(b, { autoAlpha: 0, y: 60, overwrite: true })
  }));

  ScrollTrigger.refresh();
}

render();
heroIntro();
initInteractions();
if (hasGSAP && !REDUCE && document.fonts) document.fonts.ready.then(() => ScrollTrigger.refresh());
</script>
