cv:
  name: Nguyen Manh Hiep
  headline: Software Engineer
  location: Hoang Mai, Ha Noi
  email: Hiep.work@outlook.com
  phone: "+84-978618337"
  website: https://nguyenmanhhiep.info
  social_networks:
    - network: LinkedIn
      username: hiepnm2003
    - network: GitHub
      username: TolaHiep

  sections:
    Career Objective:
      - >-
        AI-native full-stack software engineer: I bring LLMs and automation into products, and use AI
        agents as everyday development tools.
      - >-
        **Short term (1 to 2 years):** Join a product team to build and run production AI features (LLM
        integration, agents, RAG) and the backend behind them, while raising my own standards in testing,
        code review and system monitoring.
      - >-
        **Long term (3 to 5 years):** Grow into a Senior Software Engineer specialising in AI systems,
        owning a system's technical direction from design to operation and helping the team use AI safely
        in its development workflow.

    experience:
      - company: ChimAI JSC
        position: "Software Engineer, ChimAI | Notarex: notarial document digitization platform"
        start_date: 2026-03
        end_date: 2026-09
        summary: >-
          A platform that digitizes notarial paperwork for notary offices in Vietnam, covering configurable
          form templates, AI-driven OCR extraction and a full document edit, save and download cycle.
          Next.js 14, TypeScript, FastAPI, SQLAlchemy async, PostgreSQL 16, Celery, Redis, MinIO, OnlyOffice.
        highlights:
          - "**AI OCR pipeline:** Generated each document type's extraction prompt from its template
            configuration, so new document types are added through configuration alone; national IDs are
            read from their QR code and skip the model."
          - "**Document workflow and authorization:** Built the flow from uploaded photos through human review
            to a JWT-protected OnlyOffice edit, save and download cycle with docxtpl DOCX generation, under a
            three-role model scoped per notary office."
          - "**Background processing:** Built a Celery and Redis task queue on a ZSET pending queue with an
            atomic active-counter, plus heartbeat reconciliation that detects and reruns zombie jobs so no
            record gets stuck mid-OCR."
          - "**Requirements and delivery:** Collected requirements directly with notary offices, scoped each
            release in sprints in a 2 to 3 person team with no dedicated PM, and shipped on Docker behind
            Nginx with MinIO storage and GitHub Actions CI/CD."

      - company: Freelance
        position: "Software Engineer, sole developer, ASC Farm: farm production management system"
        start_date: 2026-06
        end_date: 2026-08
        summary: >-
          A web admin and offline-capable mobile PWA that runs an intercropped farm from cultivation plans to
          verified field tasks. Frappe v15 (headless), Python, MariaDB 11, Redis, React 18, TypeScript,
          Leaflet, PWA, Docker.
        highlights:
          - "**Task generation engine:** Generated field tasks idempotently from cultivation processes, with
            prerequisite chains and \"N times every N days\" frequencies, and regenerated them when a process or
            crop cycle changes."
          - "**Workload balancing:** Assigned each task to a team lead, preferring the block owner and
            otherwise the least-loaded lead, and reassigned open work automatically when a lead became
            inactive."
          - "**Offline-first field app:** Built an idempotent offline queue keyed by a client UUID, a
            service-worker app shell, and in-app completion photos stamped with GPS and a watermark as proof
            of work."
          - "**Testing and delivery:** Covered the engine, status model and permissions with 139 backend tests
            across 65 API endpoints, packaged as a one-command Docker Compose stack."

    projects:
      - name: "SmartSales: sales platform for small online shops"
        date: 2026
        summary: >-
          Solo developer. Sales software for small Vietnamese shops that puts Zalo chat, orders, calls and
          livestream selling in one place. I built it alone, from the architecture to the UI and the AI.
          Node.js 22, Express, PostgreSQL 16 + pgvector, Redis, Socket.IO, zca-js, JsSIP (SIP over WebRTC),
          Docker Compose, PM2.
        highlights:
          - "**Modular architecture:** Split the system into 7 staff modules on one PostgreSQL database. Each
            module writes only to its own schema but can join across the others, so one customer profile pulls
            in orders, chats and calls; all modules share one sign-in and one UI frame."
          - "**AI gateway and RAG:** Routed every AI call through one gateway that picks a model per task from
            .env (Gemini, OpenAI, Groq) and falls back to the next provider on failure. Documents and products
            sit in a RAG index searched by vectors and keywords together, which feeds reply suggestions and the
            shop chatbot."
          - "**Zalo and call integration:** Wrote a CLI on the open-source zca-js to connect personal Zalo
            accounts, replacing a licensed tool. Calls are recorded on two channels so the transcript knows who
            said what, and the AI scores staff attitude on 7 criteria."
          - "**Security and testing:** Kept 76 test files and an end-to-end smoke test that rerun on every
            change, fixed all 61 issues found in two security reviews, and put session, CSRF and Socket.IO
            checks in one shared layer that every module mounts."

      - name: "SenAI: real-time multilingual meeting translation ([app.senai.online](https://app.senai.online))"
        start_date: 2026
        end_date: present
        summary: >-
          Frontend, backend and AI integration owner. Live meeting translation by a 5-person team for VAIC
          2026 (three awards). Next.js 16, TypeScript, FastAPI, PostgreSQL + pgvector, LiveKit, vLLM,
          Soniox, ElevenLabs.
        highlights:
          - "**AI/LLM integration:** Built a model router for ASR, translation, TTS and LLM that switches
            provider at runtime between self-hosted vLLM and commercial APIs, falling back to the self-hosted
            model when a key is missing or a provider fails."
          - "**Translation pipeline:** Ran an independent ASR and translation pipeline per microphone to
            separate speakers, pairing fast translation with LLM refinement against a contextual glossary."
          - "**Meeting intelligence:** Added Soniox transcription that separates three or more speakers,
            LLM-written minutes with an assistant that answers questions about them, and per-speaker voiced
            translation with ElevenLabs."
          - "**Delivery and security:** Deployed through GitHub Actions over SSH with a forced command that
            skips API restarts for doc-only commits, revoked refresh tokens on logout, and kept 37 UAT suites
            with 147 real, non-mocked tests."

      - name: "Ely: personal AI assistant built on OpenClaw"
        date: 2026
        summary: >-
          Extended the open-source OpenClaw agent with Telegram commands, CDP browser automation, cron jobs
          for daily chores, my own skills that dispatch and supervise Claude Code tasks, and a
          self-restarting gateway.

    education:
      - institution: Hanoi University of Science and Technology (HUST)
        area: Computer Science
        start_date: 2021
        end_date: 2026

    Honors and Awards:
      - bullet: "Third Prize (top 3 overall of 300+ teams), Vietnam AI Innovation Challenge 2026"
      - bullet: "Vietnam AI Stars Award, Vietnam AI Innovation Challenge 2026"
      - bullet: "AI Singapore Award, Vietnam AI Innovation Challenge 2026"

    Technical Skills:
      - label: AI-assisted development
        details: Claude Code (agents, skills, hooks), OpenClaw agents, MCP servers, Cursor, Copilot, prompt
          and context engineering, RAG, LLM orchestration, model routing with fallback, vLLM
      - label: Frontend
        details: React 19/18, Next.js 16/14, TypeScript, Vite, Tailwind v4, Zustand, PWA / offline-first
      - label: Backend
        details: FastAPI, Python, Frappe v15, REST API design, Node.js / Express / NestJS, Spring Boot,
          WebSocket / Socket.IO, LiveKit, Celery, Redis queues, JWT / OAuth, RBAC, webhooks
      - label: Databases
        details: PostgreSQL (+ pgvector), MariaDB, MySQL, SQLite, SQLAlchemy 2.0 async, MinIO (S3)
      - label: DevOps and Cloud
        details: Docker Compose, Nginx, systemd, TLS, VPS deployment, GitHub Actions CI/CD
      - label: Engineering practice
        details: System design, SOLID, design patterns, code review, idempotency and concurrency control,
          workflow and scheduling engines, non-mocked integration testing, SRS / Use Case / ERD
      - label: Soft skills
        details: Critical thinking, technical research, cross-functional teamwork, fast adaptability

design:
