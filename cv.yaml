    projects:
      - name: "SenAI — Real-time Vietnamese–English Meeting Interpreter ([app.senai.online](https://app.senai.online))"
        date: 2026
        summary: AI-native platform for live bilingual meetings — per-speaker ASR, translation and voice
          cloning, automatic minutes, on-prem or commercial model routing. Built for the Vietnam AI
          Innovation Challenge 2026 (AI Singapore) — **3rd Prize + Vietnam AI Stars**. Lead developer,
          298 of 336 commits across frontend, backend and infrastructure.
        highlights:
          - "**AI-native delivery:** ~29,000 LOC in 336 commits over 3 weeks, built with Claude Code on a
            spec-driven loop (design spec → plan → agent implementation → real UAT), from a blank repo to a
            public production deployment."
          - "**Full-stack ownership:** Next.js 16 / React 19 / Tailwind v4 app with bilingual VI–EN i18n
            (~370 keys); layered FastAPI backend (routers / engine / store / model router); PostgreSQL 16 +
            pgvector for meetings, transcripts, glossaries and 1024-dim embeddings, auto-migrated on boot."
          - "**Real-time AI pipeline:** one independent ASR+MT pipeline per LiveKit mic track (no shared
            buffers), 2-lane fast→refine subtitles and a streaming *Cabin* mode that translates while the
            speaker is still talking. Measured **~75 ms ASR + ~295 ms MT (<400 ms end-to-end)**, zero errors
            up to concurrency 8."
          - "**Pluggable Model Router:** one capability contract (`asr`/`mt_fast`/`mt_refine`/`tts`/`llm`)
            behind self-hosted models (Qwen3, F5-TTS on vLLM) or commercial APIs (Google, Deepgram, OpenAI,
            ElevenLabs); pipeline, provider and keys switch at runtime from an admin UI with auto-fallback."
          - "**RAG & prompt engineering:** glossaries and uploaded documents chunked into pgvector embeddings,
            LLM term extraction, ASR phonetic correction, bilingual LLM summaries; prompt-injection defenses
            covered by a pentest suite."
          - "**Auth, security & integrations:** Google OAuth + email sign-in, JWT access/refresh rotation,
            rate limiting, per-meeting RBAC and audit logs; an on-prem-only mode blocking every cloud call
            for data residency; a public AI Gateway (`/ai/*`) with API keys; Amazon SES PDF minutes."
          - "**Deployment & QA:** VPS on Nginx + systemd + TLS with pull-based CI/CD, GitHub Actions CI on
            every push, Docker for LiveKit and PostgreSQL; **37 UAT suites / 147 real (non-mocked) tests**."

      - name: "Notarex — Notary Document OCR & Digitization"
        date: 2026
        summary: Digitizes notarial records — AI OCR from scanned papers, online editing, automatic Word
          generation. Role — full-stack, AI orchestration and infrastructure.
        highlights:
          - Built configurable form templates, the AI OCR extraction flow and an edit/save/download workflow
            through JWT-secured OnlyOffice, with automatic DOCX generation via docxtpl.
          - Designed a 3-role permission model (admin / director / employee) scoped per notary office for
            tenant isolation.
          - Built a Celery + Redis job queue (ZSET pending queue, atomic active-counter, heartbeat
            reconciliation) that detects and recovers zombie OCR jobs under load; MinIO (S3) storage,
            Dockerized behind Nginx with GitHub Actions CI/CD.
          - "Scale of delivery — **387 commits and ~55,000 LOC over 3.5 months**, covered by **43 test
            modules / 418 automated test cases**."

      - name: "EasySale — Sales Lead Management & Automation"
        date: 2026
